[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering-framework"
version = "0.1.1"
description = "A local-first engineering framework for governed AI services: reference architecture, patterns, standards, a conformance check, a use-case intake scorer and a service template."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["ai-engineering", "reference-architecture", "llmops", "ai-governance", "open-weight", "ollama", "mcp", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0,<7",   # use-case intake files
    "tomli>=2.0; python_version < \"3.11\"",  # reads waivers on Python 3.10
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "copier>=9.4,<10"]

[project.scripts]
aief = "aief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Recorded exceptions to the framework's own standards.
[tool.aief.waivers]
ENG-05 = "No model in this repository; intake scoring is checked against committed golden assessments (examples/intake) in CI"
ENG-12 = "No AI system here; every generated service carries its own SYSTEM_CARD.md"
